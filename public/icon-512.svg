<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Inner glow -->
  <rect x="40" y="40" width="432" height="432" rx="90" ry="90" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Letter J with gold gradient -->
  <text x="256" y="360" font-family="Georgia, serif" font-size="280" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle">J</text>
  
  <!-- Subtle car line decoration -->
  <path d="M120 410 Q256 370 392 410" stroke="url(#greenAccent)" stroke-width="8" fill="none" opacity="0.6"/>
  
  <!-- Small accent dots -->
  <circle cx="120" cy="120" r="8" fill="url(#goldGradient)" opacity="0.5"/>
  <circle cx="392" cy="120" r="8" fill="url(#goldGradient)" opacity="0.5"/>
</svg>
