<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="thaiPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Base subtle gradient -->
      <rect width="50" height="50" fill="#F0FDF4"/>
      
      <!-- Thai Kranok (ลายกนก) inspired curved element -->
      <path d="M25 0 Q30 10, 25 15 Q20 10, 25 0" 
            fill="none" stroke="#86EFAC" stroke-width="0.5" opacity="0.4"/>
      <path d="M25 0 Q35 15, 25 25 Q15 15, 25 0" 
            fill="none" stroke="#4ADE80" stroke-width="0.3" opacity="0.3"/>
      
      <!-- Corner lotus petal hints -->
      <path d="M0 25 Q5 20, 10 25 Q5 30, 0 25" 
            fill="#BBF7D0" opacity="0.3"/>
      <path d="M50 25 Q45 20, 40 25 Q45 30, 50 25" 
            fill="#BBF7D0" opacity="0.3"/>
      
      <!-- Center diamond (inspired by Thai geometric) -->
      <path d="M25 20 L30 25 L25 30 L20 25 Z" 
            fill="none" stroke="#22C55E" stroke-width="0.3" opacity="0.2"/>
      
      <!-- Subtle dot accents -->
      <circle cx="25" cy="25" r="1" fill="#4ADE80" opacity="0.15"/>
      <circle cx="0" cy="0" r="0.8" fill="#22C55E" opacity="0.2"/>
      <circle cx="50" cy="0" r="0.8" fill="#22C55E" opacity="0.2"/>
      <circle cx="0" cy="50" r="0.8" fill="#22C55E" opacity="0.2"/>
      <circle cx="50" cy="50" r="0.8" fill="#22C55E" opacity="0.2"/>
      
      <!-- Flowing vine curves -->
      <path d="M0 40 Q12 35, 25 40 Q38 45, 50 40" 
            fill="none" stroke="#86EFAC" stroke-width="0.4" opacity="0.25"/>
      <path d="M0 10 Q12 15, 25 10 Q38 5, 50 10" 
            fill="none" stroke="#86EFAC" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#thaiPattern)"/>
</svg>
