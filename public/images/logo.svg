<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F4D03F"/>
      <stop offset="100%" style="stop-color:#C5A028"/>
    </linearGradient>
    
    <!-- Green Gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Logo Icon - Stylized J with car element -->
  <g filter="url(#shadow)">
    <!-- Circle Background -->
    <circle cx="35" cy="40" r="28" fill="url(#greenGradient)"/>
    
    <!-- Decorative ring -->
    <circle cx="35" cy="40" r="24" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Letter J -->
    <text x="35" y="52" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">J</text>
    
    <!-- Small car silhouette under J -->
    <path d="M24 58 L26 55 L30 54 L40 54 L44 55 L46 58 L24 58Z" fill="url(#goldGradient)" opacity="0.8"/>
    <circle cx="28" cy="58" r="2" fill="url(#goldGradient)"/>
    <circle cx="42" cy="58" r="2" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Brand Name -->
  <g>
    <!-- Jarunee -->
    <text x="75" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="url(#greenGradient)" letter-spacing="1">
      Jarunee
    </text>
    
    <!-- CAR RENTAL -->
    <text x="76" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#6B7280" letter-spacing="3">
      CAR RENTAL
    </text>
    
    <!-- Gold underline -->
    <rect x="76" y="65" width="100" height="2" rx="1" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Thai decorative element -->
  <path d="M280 30 Q290 40, 280 50 Q270 40, 280 30Z" fill="url(#goldGradient)" opacity="0.4"/>
</svg>
